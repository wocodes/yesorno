name: CI & Deploy to Production (Hostinger)

on:
  # 1. Validate TypeScript & Production Bundle when pushing feature branches or opening PRs into main
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Build & Verify (Runs on every feature branch push and PR to main)
  # ============================================================================
  build-and-verify:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle (Demo Data stripped via import.meta.env.DEV=false)
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

      - name: Verify zero demo seed data in production bundle
        run: |
          if grep -rq "elena@civic.board" dist/assets/; then
            echo "❌ ERROR: Demo seed data found in production bundle!"
            exit 1
          fi
          echo "✅ Verified: Zero demo data present in dist/ production assets."

      - name: Upload production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: |
            dist/
            dist/.htaccess
          include-hidden-files: true
          retention-days: 5

  # ============================================================================
  # JOB 2: Deploy to Production (Runs ONLY when merged/pushed to `main` branch)
  # ============================================================================
  deploy-production:
    name: Deploy to Production (yesorno.chillon.top)
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yesorno.chillon.top

    steps:
      - name: Download built production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: ./dist

      - name: Normalize FTP_SERVER and FTP_SERVER_DIR
        id: ftp-config
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          # Strip any leading ftp://, ftps://, sftp://, or trailing slashes/spaces from FTP_SERVER
          CLEAN_HOST=$(echo "$RAW_SERVER" | sed -E 's#^(ftps?|sftp)://##i' | sed -E 's#/.*$##' | xargs)
          echo "host=$CLEAN_HOST" >> "$GITHUB_OUTPUT"

          # Ensure server-dir ends with a trailing slash and defaults to ./
          if [ -z "$RAW_DIR" ]; then
            echo "dir=./" >> "$GITHUB_OUTPUT"
          else
            CLEAN_DIR=$(echo "$RAW_DIR" | sed -E 's#/*$#/#')
            echo "dir=$CLEAN_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist/ to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ fromJSON(vars.FTP_PORT || '21') }}
          local-dir: ./dist/
          server-dir: ${{ steps.ftp-config.outputs.dir }}
          dangerous-clean-slate: false

