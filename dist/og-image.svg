<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="yes-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="no-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow circles -->
  <circle cx="1050" cy="120" r="320" fill="#4f46e5" fill-opacity="0.18" filter="blur(60px)"/>
  <circle cx="150" cy="520" r="280" fill="#34d399" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Logo & App Name -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="18" fill="url(#primary-glow)"/>
    <!-- Checkmark inside logo -->
    <path d="M22 34 L28 40 L42 24" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="84" y="44" fill="#ffffff" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      Yes<tspan fill="#818cf8">Or</tspan>No
    </text>
    <rect x="255" y="20" width="145" height="28" rx="6" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8" stroke-width="1"/>
    <text x="267" y="39" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">DECISION PLATFORM</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="220" fill="#ffffff" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Vote YES or NO on Issues
  </text>
  <text x="80" y="280" fill="#a5b4fc" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    That Matter to You.
  </text>

  <!-- Tagline / Subtitle -->
  <text x="80" y="340" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="700">
    ⚡ It takes less than 1 min to make your voice heard &amp; make an impact.
  </text>
  </text>

  <!-- Spheres Pill Chips -->
  <g transform="translate(80, 380)">
    <!-- Pill 1: Workplace -->
    <rect x="0" y="0" width="135" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">💼 Workplace</text>

    <!-- Pill 2: Family -->
    <rect x="145" y="0" width="110" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="162" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">👨‍👩‍👧 Family</text>

    <!-- Pill 3: Communal -->
    <rect x="265" y="0" width="135" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="282" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🏡 Communal</text>

    <!-- Pill 4: Religious -->
    <rect x="410" y="0" width="125" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="427" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🕊️ Religious</text>

    <!-- Pill 5: Groups -->
    <rect x="545" y="0" width="110" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="562" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">👥 Groups</text>

    <!-- Pill 6: Policies -->
    <rect x="665" y="0" width="115" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="682" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📋 Policies</text>
  </g>

  <!-- Interactive Vote Mock Preview Card on Right -->
  <g transform="translate(800, 160)" filter="url(#shadow)">
    <!-- White Card -->
    <rect width="320" height="380" rx="24" fill="#ffffff"/>
    
    <!-- Header Tag -->
    <rect x="24" y="24" width="130" height="24" rx="12" fill="#e0e7ff"/>
    <text x="36" y="40" fill="#4338ca" font-family="sans-serif" font-size="11" font-weight="700">WORKPLACE &amp; CAREER</text>
    
    <circle cx="280" cy="36" r="4" fill="#10b981"/>
    <text x="235" y="40" fill="#64748b" font-family="sans-serif" font-size="11">Active</text>

    <!-- Question -->
    <text x="24" y="85" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700">
      Pilot a 4-Day Work Week
    </text>
    <text x="24" y="110" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700">
      with 100% Full Salary?
    </text>

    <!-- YES and NO Button simulation -->
    <g transform="translate(24, 140)">
      <rect width="130" height="60" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="45" y="36" fill="#065f46" font-family="sans-serif" font-size="16" font-weight="800">YES 85%</text>

      <rect x="142" width="130" height="60" rx="14" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="190" y="36" fill="#9f1239" font-family="sans-serif" font-size="16" font-weight="800">NO 15%</text>
    </g>

    <!-- Progress Bar -->
    <rect x="24" y="225" width="272" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="24" y="225" width="231" height="10" rx="5" fill="#10b981"/>
    
    <!-- Audio Waveform attachment preview -->
    <g transform="translate(24, 255)">
      <rect width="272" height="50" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <!-- Play circle -->
      <circle cx="28" cy="25" r="14" fill="#4f46e5"/>
      <polygon points="25,19 35,25 25,31" fill="#ffffff"/>
      <text x="52" y="24" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="700">Voice Note Attached (0:24)</text>
      <text x="52" y="38" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="600">🛡️ Deep Voice Mask Applied</text>
    </g>

    <!-- Time-bound indicator -->
    <text x="24" y="340" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600">⏱️ Closes in 4d 18h • 280 Votes Cast</text>
  </g>
</svg>

