    <script>
      // Service Worker registration with safe dev-mode bypass
      if ('serviceWorker' in navigator) {
        const isLocalhost = Boolean(
          window.location.hostname === 'localhost' ||
          window.location.hostname === '[::1]' ||
          window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
        );

        if (isLocalhost) {
          // In local dev, unregister any existing service worker to prevent stale caching
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) {
                if (name.startsWith('yesorno-')) caches.delete(name);
              }
            });
          }
        } else {
          // In production, register the PWA service worker
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('YesOrNo Service Worker active:', reg.scope))
              .catch((err) => console.warn('Service Worker registration skipped:', err));
          });
        }
      }
